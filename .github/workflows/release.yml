name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------
  # Read the app name/version once, share it with every other job
  # ----------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.vars.outputs.app_name }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          APP_NAME=$(grep '^name:' pubspec.yaml | head -1 | awk '{print $2}')
          VERSION=${GITHUB_REF_NAME#v}
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------
  # Windows build (Installer .exe + Portable .zip)
  # ----------------------------------------------------------------------
  build-windows:
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Build Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppName="${{ needs.setup.outputs.app_name }}" /DMyAppVersion="${{ needs.setup.outputs.version }}" packaging/windows/setup.iss
          Move-Item -Path "dist-setup\*.exe" -Destination "."

      - name: Zip build output (Portable .zip)
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dest = "${{ needs.setup.outputs.app_name }}-${{ needs.setup.outputs.version }}-windows-portable.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $dest

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            *-windows-setup.exe
            *-windows-portable.zip

  # ----------------------------------------------------------------------
  # Linux build (Portable .tar.gz and .zip)
  # ----------------------------------------------------------------------
  build-linux:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Archive Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "../../../../../${{ needs.setup.outputs.app_name }}-${{ needs.setup.outputs.version }}-linux.tar.gz" .
          zip -r "../../../../../${{ needs.setup.outputs.app_name }}-${{ needs.setup.outputs.version }}-linux.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            *-linux.tar.gz
            *-linux.zip

  # ----------------------------------------------------------------------
  # macOS build (Drag-and-Drop .dmg Installer + .zip)
  # ----------------------------------------------------------------------
  build-macos:
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Build macOS DMG Installer (.dmg)
        run: |
          APP_NAME="${{ needs.setup.outputs.app_name }}"
          VERSION="${{ needs.setup.outputs.version }}"
          DMG_NAME="${APP_NAME}-${VERSION}-macos.dmg"
          
          mkdir -p dmg_staging
          cp -r "build/macos/Build/Products/Release/${APP_NAME}.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          
          hdiutil create -volname "${APP_NAME}" -srcfolder dmg_staging -ov -format UDZO "${DMG_NAME}"
          rm -rf dmg_staging

      - name: Zip .app bundle (Fallback .zip)
        run: |
          cd build/macos/Build/Products/Release
          zip -r "${{ needs.setup.outputs.app_name }}-${{ needs.setup.outputs.version }}-macos.zip" *.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            *-macos.dmg
            build/macos/Build/Products/Release/*-macos.zip

  # ----------------------------------------------------------------------
  # Collect all builds and publish GitHub Release
  # ----------------------------------------------------------------------
  release:
    needs: [setup, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.setup.outputs.app_name }} v${{ needs.setup.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.setup.outputs.version, '-') }}
          generate_release_notes: true
          files: dist/*
