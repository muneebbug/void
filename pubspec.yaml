name: void_app
description: "VOID - A local-first desktop application for cataloging and managing personal media collections."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0
  go_router: ^17.5.0
  uuid: ^4.4.0
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  http: ^1.2.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true